plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.12.0'
}

group = 'igrus'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.retry:spring-retry:2.0.11'
	implementation 'org.springframework:spring-aspects'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'
	implementation 'org.openapitools:jackson-databind-nullable:0.2.6'

	// JSON structured logging (production)
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	// Jackson 2.x - Spring Boot가 버전을 관리함 (JSR-310 지원을 위해 JavaTimeModule 등록 필요)

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	testImplementation 'io.jsonwebtoken:jjwt-impl:0.12.6'

	// Spring Cloud AWS
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager:3.4.0'
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.4.0'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApiGenerate {
	generatorName = 'spring'
	inputSpec = file("${rootProject.projectDir}/../openapi/openapi.yaml").absolutePath.replace('\\', '/')
	outputDir = layout.buildDirectory.dir("generated/openapi").get().asFile.absolutePath
	apiPackage = 'igrus.web.generated.api'
	modelPackage = 'igrus.web.generated.model'
	configOptions = [
		interfaceOnly      : 'true',
		useTags            : 'true',
		useSpringBoot3     : 'true',
		useJakartaEe       : 'true',
		openApiNullable    : 'false',
		skipDefaultInterface: 'true',
		useBeanValidation  : 'true',
		documentationProvider: 'none',
	]
	typeMappings = ['DateTime': 'java.time.Instant']
	importMappings = ['java.time.OffsetDateTime': 'java.time.Instant']
}

sourceSets {
	main {
		java {
			srcDir "${layout.buildDirectory.get()}/generated/openapi/src/main/java"
		}
	}
}

tasks.named('compileJava') {
	dependsOn 'openApiGenerate'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootJar') {
	archiveFileName = 'igrus-web-server.jar'
}
