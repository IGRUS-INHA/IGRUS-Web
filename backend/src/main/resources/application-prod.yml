spring:
  datasource:
    url: jdbc:mysql://igrus-web-mysql-rds.chw2emo2eysf.ap-northeast-2.rds.amazonaws.com:3306/igrus_web
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  task:
    scheduling:
      pool:
        size: 5  # 스케줄러 스레드 풀 크기
  cloud:
    aws:
      region:
        static: ap-northeast-2
      secretsmanager:
        enabled: true
  config:
    import: "aws-secretsmanager:igrus/web/server/prod"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${spring.mail.username}
    password: ${spring.mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  server-url: https://api.igrus.co.kr

app:
  jwt:
    secret: ${app.jwt.secret}
  cookie:
    secure: true
    same-site: Lax
    domain: igrus.co.kr
  frontend-url: https://www.igrus.co.kr
  sso:
    allowed-redirect-origins: https://play.igrus.co.kr,https://inhaplay.com,https://www.inhaplay.com
  webhook:
    baebdung-i:
      secret: ${app.webhook.baebdung-i.secret}