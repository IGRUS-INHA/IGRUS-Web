spring:
  datasource:
    url: jdbc:mysql://igrus-web-staging-mysql-rds.chw2emo2eysf.ap-northeast-2.rds.amazonaws.com:3306/igrus_web_staging
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  task:
    scheduling:
      pool:
        size: 5
  cloud:
    aws:
      region:
        static: ap-northeast-2
      secretsmanager:
        enabled: true
  config:
    import: "aws-secretsmanager:igrus/web/server/staging"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${spring.mail.username}
    password: ${spring.mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  server-url: https://staging-api.igrus.co.kr

app:
  jwt:
    secret: ${app.jwt.secret}
  cookie:
    secure: true
    same-site: Lax
    domain: igrus.co.kr
  frontend-url: https://staging.igrus.co.kr
  webhook:
    baebdung-i:
      enabled: false
