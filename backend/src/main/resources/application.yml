spring:
  profiles:
    active: ${SPRING_ACTIVE_PROFILE}
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  default-produces-media-type: application/json

app:
  version:
    commit: ${GIT_COMMIT_HASH:unknown}
  jwt:
    access-token-validity: 300000        # 5분
    refresh-token-validity: 259200000   # 3일
    refresh-token-grace-period: 10000   # 10초
    issuer: igrus-api
    audience: igrus-web
  security:
    login-attempts-max: 5
    login-lockout-minutes: 30
  mail:
    from-address: ${MAIL_FROM_ADDRESS:noreply@igrus.inha.ac.kr}
    verification-code-expiry: 600000    # 10분
    verification-max-attempts: 5
    password-reset-expiry: 1800000      # 30분
    resend-rate-limit-seconds: 60       # 1분
  webhook:
    baebdung-i:
      url: https://v2zb74shbf.execute-api.ap-northeast-2.amazonaws.com/prod/api/webhooks/submissions
      enabled: true
      timeout: 5000
  cleanup:
    unverified-user-retention-hours: 24 # 24시간
