spring:
  cloud:
    aws:
      secretsmanager:
        enabled: false
      s3:
        enabled: false
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

logging:
  level:
    igrus.web.storage: INFO

openapi:
  validation:
    filter:
      enabled: false

app:
  version:
    commit: test
  jwt:
    secret: test-secret-key-for-testing-purposes-only-must-be-at-least-256-bits
    access-token-validity: 3600000
    refresh-token-validity: 604800000
    issuer: igrus-api
    audience: igrus-web
  mail:
    verification-code-expiry: 600000
    verification-max-attempts: 5
    password-reset-expiry: 1800000
  webhook:
    baebdung-i:
      url: https://test-webhook.example.com/api/webhooks/submissions
      secret: test-secret
      enabled: false
      timeout: 5000
  storage:
    s3:
      bucket-name: test-bucket
    upload-url-expiration: 300
    download-url-expiration: 3600
    max-file-size: 10485760
