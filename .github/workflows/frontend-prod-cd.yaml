name: Frontend Production CD Pipeline
# main push(frontend/openapi 변경) 자동 배포 — backend-prod-cd.yaml 과 같은 패턴.
# 버전 태그 릴리즈는 release.yaml 이 workflow_call 로 호출한다.

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'openapi/**'
      - '.github/workflows/frontend-prod-cd.yaml'
  workflow_dispatch:
    inputs:
      version:
        description: '배포 버전 표기 (비우면 커밋 SHA)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_FRONTEND_GITHUB_ACTIONS_ROLE_ARN: ${{ vars.AWS_FRONTEND_GITHUB_ACTIONS_ROLE_ARN }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_APP_VERSION: ${{ inputs.version || format('main-{0}', github.sha) }}
          FEATURE_COMMUNITY: 'false'
          FEATURE_SEARCH: 'false'
          FEATURE_PROFILE_EDIT: 'false'
          FEATURE_EVENTS: 'true'
          FEATURE_INSTAGRAM: 'false'
          FEATURE_DARK_MODE: 'false'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_FRONTEND_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Deploy to S3
        run: |
          aws s3 sync ./dist s3://${{ env.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CF_DISTRIBUTION_ID }} \
            --paths "/index.html"
