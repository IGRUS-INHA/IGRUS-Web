name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  create-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: bump
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)

          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi

          VERSION="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "## Release Version" >> $GITHUB_STEP_SUMMARY
          echo "**$LATEST** → **$NEW_VERSION** (${{ inputs.bump }})" >> $GITHUB_STEP_SUMMARY

      - name: Create and push tag
        run: |
          git tag ${{ steps.bump.outputs.version }}
          git push origin ${{ steps.bump.outputs.version }}

  deploy-backend:
    name: Deploy Backend
    needs: create-tag
    uses: ./.github/workflows/backend-prod-cd.yaml
    with:
      version: ${{ needs.create-tag.outputs.version }}
    secrets: inherit

  deploy-frontend:
    name: Deploy Frontend
    needs: create-tag
    uses: ./.github/workflows/frontend-prod-cd.yaml
    with:
      version: ${{ needs.create-tag.outputs.version }}
    secrets: inherit
