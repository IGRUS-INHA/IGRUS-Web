name: Frontend CI Pipeline

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/github-script@v7
        id: filter
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const frontendChanged = files.some(f =>
              (f.filename.startsWith('frontend/') && !f.filename.startsWith('frontend/docs/')) ||
               f.filename.startsWith('openapi/') ||
               f.filename === '.github/workflows/frontend-ci.yaml'
            );
            core.setOutput('frontend', frontendChanged ? 'true' : 'false');

  build-and-lint:
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and regenerate Orval API client
        run: |
          pnpm api:generate
          if [ -n "$(git -C .. status --porcelain frontend/src/api/model openapi/bundled.yaml)" ]; then
            echo "::warning::Orval API client is outdated. Auto-committing regenerated files."
            git -C .. config user.name "github-actions[bot]"
            git -C .. config user.email "github-actions[bot]@users.noreply.github.com"
            git -C .. add frontend/src/api/model openapi/bundled.yaml
            git -C .. commit -m "chore(frontend): Orval API 클라이언트 재생성"
            git -C .. push
          else
            echo "Orval API client is up to date."
          fi

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Format check
        run: npx prettier --check .

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          FEATURE_COMMUNITY: 'false'
          FEATURE_SEARCH: 'false'
          FEATURE_PROFILE_EDIT: 'false'
          FEATURE_EVENTS: 'false'
          FEATURE_INSTAGRAM: 'false'
