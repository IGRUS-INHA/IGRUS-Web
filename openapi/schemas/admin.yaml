ChangeUserStatusRequest:
  type: object
  description: 회원 상태 변경 요청
  properties:
    action:
      type: string
      description: 수행할 행위
      enum:
      - SUSPEND
      - LIFT
      example: SUSPEND
    reason:
      type: string
      description: 정지 사유 (SUSPEND일 때 필수)
      example: 규칙 위반
    suspendedUntil:
      type: string
      format: date-time
      description: 정지 종료일 (SUSPEND일 때 필수)
      example: '2025-03-01T00:00:00Z'
  required:
  - action
ChangeUserRoleRequest:
  type: object
  description: 회원 권한 변경 요청
  properties:
    role:
      type: string
      description: 변경할 역할
      enum:
      - ASSOCIATE
      - MEMBER
      - OPERATOR
      - ADMIN
      example: MEMBER
  required:
  - role
RegisterSemesterMembersRequest:
  type: object
  description: 학기별 회원 등록 요청
  properties:
    userIds:
      type: array
      description: 등록할 회원 ID 목록
      example:
      - 1
      - 2
      - 3
      items:
        type: integer
        format: int64
      minItems: 1
  required:
  - userIds
RegisterSemesterMembersResponse:
  type: object
  description: 학기별 회원 등록 결과 응답
  properties:
    registeredCount:
      type: integer
      format: int32
      description: 등록된 회원 수
      example: 5
    skippedCount:
      type: integer
      format: int32
      description: 이미 등록되어 건너뛴 회원 수
      example: 2
    totalRequested:
      type: integer
      format: int32
      description: 요청된 총 회원 수
      example: 7
RejectAssociateRequest:
  type: object
  description: 준회원 거절 요청
  properties:
    reason:
      type: string
      description: 거절 사유
      example: 가입 동기가 불충분합니다.
      maxLength: 255
      minLength: 0
  required:
  - reason
BulkRejectionRequest:
  type: object
  description: 준회원 일괄 거절 요청
  properties:
    userIds:
      type: array
      description: 거절할 사용자 ID 목록
      example:
      - 1
      - 2
      - 3
      items:
        type: integer
        format: int64
      minItems: 1
    reason:
      type: string
      description: 거절 사유
      example: 가입 동기가 불충분합니다.
      maxLength: 255
      minLength: 0
  required:
  - reason
  - userIds
BulkRejectionResultResponse:
  type: object
  description: 준회원 일괄 거절 결과 응답
  properties:
    rejectedCount:
      type: integer
      format: int32
      description: 거절 성공 수
      example: 3
    failedCount:
      type: integer
      format: int32
      description: 거절 실패 수
      example: 1
    totalRequested:
      type: integer
      format: int32
      description: 총 요청 수
      example: 4
BulkApprovalRequest:
  type: object
  description: 일괄 준회원 승인 요청
  properties:
    userIds:
      type: array
      description: 승인할 사용자 ID 목록
      example:
      - 1
      - 2
      - 3
      items:
        type: integer
        format: int64
      minItems: 1
    reason:
      type: string
      description: 승인 사유 (선택)
      example: 2026년 1월 일괄 승인
      maxLength: 255
      minLength: 0
  required:
  - userIds
BulkApprovalResultResponse:
  type: object
  description: 일괄 승인 결과 응답
  properties:
    approvedCount:
      type: integer
      format: int32
      description: 승인 성공 건수
      example: 5
    failedCount:
      type: integer
      format: int32
      description: 승인 실패 건수
      example: 1
    totalRequested:
      type: integer
      format: int32
      description: 총 요청 건수
      example: 6
AdminEditUserInfoRequest:
  type: object
  description: '관리자 회원 정보 수정 요청 (부분 업데이트: null 필드는 기존 값 유지)'
  properties:
    studentId:
      type: string
      description: 학번 (null이면 변경하지 않음)
      example: 20231234
      pattern: ^\d{8}$
    email:
      type: string
      format: email
      description: 이메일 (null이면 변경하지 않음)
      example: user@inha.edu
    name:
      type: string
      description: 이름 (null이면 변경하지 않음)
      example: 홍길동
      maxLength: 50
      minLength: 1
    phoneNumber:
      type: string
      description: 전화번호 (null이면 변경하지 않음)
      example: 010-1234-5678
    department:
      type: string
      description: 학과 (null이면 변경하지 않음)
      example: 컴퓨터공학과
      maxLength: 50
      minLength: 0
    gender:
      type: string
      description: 성별 (null이면 변경하지 않음)
      enum:
      - MALE
      - FEMALE
    grade:
      type: integer
      format: int32
      description: 학년 (null이면 변경하지 않음)
      example: 2
      maximum: 4
      minimum: 1
    enrollmentStatus:
      type: string
      description: 재학 상태 (null이면 변경하지 않음)
      enum:
      - ENROLLED
      - GENERAL_LEAVE
      - MILITARY_LEAVE
    motivation:
      type: string
      description: 가입 동기 (null이면 변경하지 않음)
    wishes:
      type: array
      description: 가입 목적 (null이면 변경하지 않음)
      items:
        type: string
        enum:
        - NETWORKING
        - STUDY
        - PROJECT
        - CAREER
        - PROGRAMMING
    interests:
      type: array
      description: 관심 분야 (null이면 변경하지 않음)
      items:
        type: string
        enum:
        - WEB_FRONTEND
        - WEB_BACKEND
        - APP
        - SECURITY
        - UI_UX_DESIGN
        - OTHER_DESIGN
        - AI
        - CLOUD
        - GAME
        - OTHER
    customInterest:
      type: string
      description: 기타 관심 분야 (null이면 변경하지 않음)
      maxLength: 100
      minLength: 0
    joinRoute:
      type: string
      description: 가입 경로 (null이면 변경하지 않음)
      enum:
      - EVERYTIME
      - POSTER
      - OT
      - REFERRAL
      - OTHER
    customJoinRoute:
      type: string
      description: 기타 가입 경로 (null이면 변경하지 않음)
      maxLength: 100
      minLength: 0
