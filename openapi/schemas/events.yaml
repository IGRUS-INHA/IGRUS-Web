RegisterEventRequest:
  type: object
  description: 행사 신청 요청. 설문 연결 행사의 경우 surveyAnswers를 포함하여 설문 응답과 행사 신청을 원자적으로 처리합니다.
  properties:
    surveyAnswers:
      type:
        - array
        - 'null'
      description: 설문 응답 배열. 설문 연결 행사 신청 시 설문 응답을 포함합니다. 이미 응답한 경우 생략 가능합니다.
      items:
        $ref: ../schemas/surveys.yaml#/SubmitAnswerRequest
RegistrationListResponse:
  type: object
  properties:
    registrationId:
      type: integer
      format: int64
    userId:
      type:
        - integer
        - 'null'
      format: int64
      description: 회원 신청자의 사용자 ID (외부인 신청의 경우 null)
    userName:
      type: string
      description: 신청자 이름
    userEmail:
      type:
        - string
        - 'null'
      description: 신청자 이메일 (외부인 신청의 경우 null)
    studentId:
      type:
        - string
        - 'null'
      description: 학번
    userGender:
      type:
        - string
        - 'null'
      description: 성별 (외부인의 경우 null)
    userGrade:
      type:
        - integer
        - 'null'
      format: int32
      description: 학년 (외부인의 경우 null)
    userDepartment:
      type:
        - string
        - 'null'
      description: 학과
    phone:
      type:
        - string
        - 'null'
      description: 연락처 (외부인의 경우에만 표시)
    isExternal:
      type: boolean
      description: 외부인 신청 여부
    status:
      type: string
      enum:
      - REGISTERED
      - WAITING
      - APPROVED
      - REJECTED
      - CANCELED
    registeredAt:
      type: string
      format: date-time
EventAttachmentResponse:
