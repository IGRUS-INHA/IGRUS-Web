UpdateEventRequest:
  type: object
  properties:
    title:
      type: string
      maxLength: 100
      minLength: 0
    description:
      type: string
      minLength: 1
    location:
      type: string
      maxLength: 200
      minLength: 0
    eventStartAt:
      type: string
      format: date-time
    eventEndAt:
      type: string
      format: date-time
    registrationStartAt:
      type: string
      format: date-time
    registrationEndAt:
      type: string
      format: date-time
    capacity:
      type: integer
      format: int32
      minimum: 1
  required:
  - capacity
  - description
  - eventEndAt
  - eventStartAt
  - location
  - registrationEndAt
  - registrationStartAt
  - title
EventDetailResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    title:
      type: string
    description:
      type: string
    location:
      type: string
    authorName:
      type: string
    eventStartAt:
      type: string
      format: date-time
    eventEndAt:
      type: string
      format: date-time
    registrationStartAt:
      type: string
      format: date-time
    registrationEndAt:
      type: string
      format: date-time
    capacity:
      type: integer
      format: int32
    currentCount:
      type: integer
      format: int32
    visibility:
      type: string
      enum:
      - UNPUBLISHED
      - PUBLISHED
    registrationStatus:
      type: string
      enum:
      - NOT_STARTED
      - OPEN
      - CLOSED
    eventStatus:
      type: string
      enum:
      - UPCOMING
      - ONGOING
      - COMPLETED
      - CANCELED
    closeReason:
      type: string
      enum:
      - CAPACITY_FULL
      - DEADLINE_PASSED
      - MANUAL_CLOSE
    registrationType:
      type: string
      enum:
      - AUTO_APPROVE
      - MANUAL_APPROVE
    isRegistrable:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    canEdit:
      type: boolean
    isRegistered:
      type: boolean
RegistrationResponse:
  type: object
  properties:
    registrationId:
      type: integer
      format: int64
    status:
      type: string
      enum:
      - REGISTERED
      - WAITING
      - APPROVED
      - REJECTED
      - CANCELED
    isRegistered:
      type: boolean
