      type: integer
      format: int64
      description: 첨부파일 연결 ID
    fileMetadataId:
      type: integer
      format: int64
      description: 파일 메타데이터 ID
    objectKey:
      type: string
      description: S3 Object Key
    originalFileName:
      type: string
      description: 원본 파일명
    contentType:
      type: string
      description: 파일 MIME 타입
ExternalRegisterEventRequest:
  type: object
  description: |
    외부인(비회원) 행사 신청 요청.
    학번과 전화번호 각각 동일 행사 내 중복 신청을 방지합니다.
    설문 연결 행사의 경우 surveyAnswers를 포함하여 설문 응답과 행사 신청을 원자적으로 처리합니다.
  properties:
    name:
      type: string
      maxLength: 50
      minLength: 1
      description: 신청자 이름
    studentId:
      type: string
      maxLength: 20
      minLength: 1
      description: 신청자 학번 (중복 방지 식별자)
    phone:
      type: string
      maxLength: 20
      minLength: 1
      description: 신청자 연락처 (중복 방지 식별자)
    department:
      type: string
      maxLength: 100
      minLength: 1
      description: 신청자 학과
    surveyAnswers:
      type:
        - array
        - 'null'
      description: 설문 응답 배열. 설문 연결 행사 신청 시 설문 응답을 포함합니다.
      items:
        $ref: ../schemas/surveys.yaml#/SubmitAnswerRequest
  required:
  - name
  - studentId
  - phone
  - department
