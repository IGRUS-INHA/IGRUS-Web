UpdateEventRequest:
  type: object
  properties:
    title:
      type: string
      maxLength: 100
      minLength: 0
    description:
      type: string
      minLength: 1
    location:
      type: string
      maxLength: 200
      minLength: 0
    eventStartAt:
      type: string
      format: date-time
    eventEndAt:
      type: string
      format: date-time
    registrationStartAt:
      type: string
      format: date-time
    registrationEndAt:
      type: string
      format: date-time
    capacity:
      type: integer
      format: int32
      minimum: 1
    surveyId:
      type:
        - integer
        - 'null'
      format: int64
      description: 연결할 설문 ID (null이면 설문 미연결)
    attachmentFileIds:
      type:
        - array
        - 'null'
      description: 첨부파일 ID 목록 (전체 교체 방식)
      items:
        type: integer
        format: int64
    allowExternal:
      type: boolean
      description: 외부인(비회원) 신청 허용 여부
  required:
  - capacity
  - description
  - eventEndAt
  - eventStartAt
  - location
  - registrationEndAt
  - registrationStartAt
  - title
EventDetailResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    title:
      type: string
    description:
      type: string
    location:
      type: string
    authorName:
      type: string
    eventStartAt:
      type: string
      format: date-time
    eventEndAt:
      type: string
      format: date-time
    registrationStartAt:
      type: string
      format: date-time
    registrationEndAt:
      type: string
      format: date-time
    capacity:
      type: integer
      format: int32
    currentCount:
      type: integer
      format: int32
    visibility:
      type: string
      enum:
      - UNPUBLISHED
      - PUBLISHED
    registrationStatus:
      type: string
      enum:
      - NOT_STARTED
      - OPEN
      - CLOSED
    eventStatus:
      type: string
      enum:
      - UPCOMING
      - ONGOING
      - COMPLETED
      - CANCELED
    closeReason:
      type:
        - string
        - 'null'
      enum:
      - CAPACITY_FULL
      - DEADLINE_PASSED
      - MANUAL_CLOSE
      - null
    registrationType:
      type: string
      enum:
      - AUTO_APPROVE
      - MANUAL_APPROVE
    isRegistrable:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    canEdit:
      type: boolean
    isRegistered:
      type: boolean
    surveyId:
      type:
        - integer
        - 'null'
      format: int64
      description: 연결된 설문 ID (null이면 설문 미연결)
    attachments:
      type:
        - array
        - 'null'
      description: 첨부파일 목록
      items:
        $ref: '#/EventAttachmentResponse'
    allowExternal:
      type: boolean
      description: 외부인(비회원) 신청 허용 여부
