UpdateSurveyRequest:
  type: object
  properties:
    title:
      type: string
      maxLength: 100
      minLength: 0
    description:
      type: string
      maxLength: 500
      minLength: 0
    accessLevel:
      type: string
      enum:
      - PUBLIC
      - ASSOCIATE
      - MEMBER
      - OPERATOR
    deadline:
      type: string
      format: date-time
  required:
  - accessLevel
  - title
OptionResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    text:
      type: string
    displayOrder:
      type: integer
      format: int32
QuestionResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    questionType:
      type: string
      enum:
      - SHORT_ANSWER
      - PARAGRAPH
      - MULTIPLE_CHOICE
      - CHECKBOX
      - DROPDOWN
      - LINEAR_SCALE
      - MULTIPLE_CHOICE_GRID
      - CHECKBOX_GRID
      - DATE
      - TIME
      - FILE_UPLOAD
    title:
      type: string
    description:
      type: string
    required:
      type: boolean
    displayOrder:
      type: integer
      format: int32
    scaleMin:
      type: integer
      format: int32
    scaleMax:
      type: integer
      format: int32
    options:
      type: array
      items:
        $ref: '#/OptionResponse'
    rows:
      type: array
      items:
        $ref: '#/RowResponse'
RowResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    label:
      type: string
    displayOrder:
      type: integer
      format: int32
SurveyDetailResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    title:
      type: string
    description:
      type: string
    visibility:
      type: string
      enum:
      - UNPUBLISHED
      - PUBLISHED
    responseStatus:
      type: string
      enum:
      - NOT_STARTED
      - OPEN
      - CLOSED
    accessLevel:
      type: string
      enum:
      - PUBLIC
      - ASSOCIATE
      - MEMBER
      - OPERATOR
    deadline:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    questions:
      type: array
      items:
        $ref: '#/QuestionResponse'
    responseCount:
      type: integer
      format: int32
      description: 제출된 응답 수 (soft-delete 제외)
SubmitSurveyResponseRequest:
  type: object
  properties:
    answers:
      type: array
      items:
        $ref: '#/SubmitAnswerRequest'
  required:
  - answers
SurveyResponseDetailResponse:
  type: object
  properties:
    responseId:
      type: integer
      format: int64
    surveyId:
      type: integer
      format: int64
    userId:
      type: integer
      format: int64
    answers:
      type: array
      items:
        $ref: '#/AnswerResponse'
    createdAt:
      type: string
      format: date-time
CreateSurveyRequest:
  type: object
  properties:
    title:
      type: string
      maxLength: 100
      minLength: 0
    description:
      type: string
      maxLength: 500
      minLength: 0
    accessLevel:
      type: string
      enum:
      - PUBLIC
      - ASSOCIATE
      - MEMBER
      - OPERATOR
    deadline:
      type: string
      format: date-time
  required:
  - accessLevel
  - title
CreateQuestionRequest:
  type: object
  properties:
    questionType:
      type: string
      enum:
      - SHORT_ANSWER
      - PARAGRAPH
      - MULTIPLE_CHOICE
      - CHECKBOX
      - DROPDOWN
      - LINEAR_SCALE
      - MULTIPLE_CHOICE_GRID
      - CHECKBOX_GRID
      - DATE
      - TIME
      - FILE_UPLOAD
    title:
      type: string
      maxLength: 200
      minLength: 0
    description:
      type: string
      maxLength: 500
      minLength: 0
    required:
      type: boolean
    displayOrder:
      type: integer
      format: int32
  required:
  - questionType
  - title
SaveQuestionRowRequest:
  type: object
  properties:
    label:
      type: string
      maxLength: 200
      minLength: 0
    displayOrder:
      type: integer
      format: int32
  required:
  - label
SaveQuestionOptionRequest:
  type: object
  properties:
    text:
      type: string
      maxLength: 200
      minLength: 0
    displayOrder:
      type: integer
      format: int32
  required:
  - text
UpdateQuestionRequest:
  type: object
  properties:
    questionType:
      type: string
      enum:
      - SHORT_ANSWER
      - PARAGRAPH
      - MULTIPLE_CHOICE
      - CHECKBOX
      - DROPDOWN
      - LINEAR_SCALE
      - MULTIPLE_CHOICE_GRID
      - CHECKBOX_GRID
      - DATE
      - TIME
      - FILE_UPLOAD
    title:
      type: string
      maxLength: 200
      minLength: 0
    description:
      type: string
      maxLength: 500
      minLength: 0
    required:
      type: boolean
    displayOrder:
      type: integer
      format: int32
  required:
  - questionType
  - title
SurveyListResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    title:
      type: string
    visibility:
      type: string
      enum:
      - UNPUBLISHED
      - PUBLISHED
    responseStatus:
      type: string
      enum:
      - NOT_STARTED
      - OPEN
      - CLOSED
    accessLevel:
      type: string
      enum:
      - PUBLIC
      - ASSOCIATE
      - MEMBER
      - OPERATOR
    deadline:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    responseCount:
      type: integer
      format: int32
      description: 제출된 응답 수 (soft-delete 제외)
SubmitAnswerRequest:
  type: object
  properties:
    questionId:
      type: integer
      format: int64
    textValue:
      type: string
    selectedOptionIds:
      type: array
      items:
        type: integer
        format: int64
    numericValue:
      type: integer
      format: int32
    gridAnswers:
      type: array
      items:
        $ref: '#/GridAnswerRequest'
  required:
  - questionId
AnswerResponse:
  type: object
  properties:
    questionId:
      type: integer
      format: int64
    questionType:
      type: string
      enum:
      - SHORT_ANSWER
      - PARAGRAPH
      - MULTIPLE_CHOICE
      - CHECKBOX
      - DROPDOWN
      - LINEAR_SCALE
      - MULTIPLE_CHOICE_GRID
      - CHECKBOX_GRID
      - DATE
      - TIME
      - FILE_UPLOAD
    textValue:
      type: string
    selectedOptionIds:
      type: array
      items:
        type: integer
        format: int64
    numericValue:
      type: integer
      format: int32
    gridAnswers:
      type: array
      items:
        $ref: '#/GridAnswerResponse'
GridAnswerResponse:
  type: object
  properties:
    rowId:
      type: integer
      format: int64
    selectedOptionIds:
      type: array
      items:
        type: integer
        format: int64
GridAnswerRequest:
  type: object
  properties:
    rowId:
      type: integer
      format: int64
    selectedOptionIds:
      type: array
      items:
        type: integer
        format: int64
      minItems: 1
  required:
  - rowId
  - selectedOptionIds
AdminSurveyResponseListItem:
  type: object
  description: 관리자 설문 응답 목록 항목
  properties:
    responseId:
      type: integer
      format: int64
      description: 응답 ID
    userId:
      type: integer
      format: int64
      description: 응답자 사용자 ID (비회원 응답 시 null)
    userName:
      type: string
      description: 응답자 이름 (비회원 응답 시 null)
    submittedAt:
      type: string
      format: date-time
      description: 응답 제출 시각
    answers:
      type: array
      description: 답변 목록
      items:
        $ref: '#/AnswerResponse'
