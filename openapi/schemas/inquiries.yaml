UpdateInquiryStatusRequest:
  type: object
  description: 문의 상태 변경 요청
  properties:
    status:
      type: string
      description: 변경할 문의 상태
      enum:
      - PENDING
      - IN_PROGRESS
      - COMPLETED
      example: IN_PROGRESS
  required:
  - status
UpdateInquiryReplyRequest:
  type: object
  description: 문의 답변 수정 요청
  properties:
    content:
      type: string
      description: 수정할 답변 내용
      example: 안녕하세요. 수정된 답변 내용입니다.
      minLength: 1
  required:
  - content
InquiryReplyResponse:
  type: object
  description: 문의 답변 응답
  properties:
    id:
      type: integer
      format: int64
      description: 답변 ID
      example: 1
    content:
      type: string
      description: 답변 내용
      example: 안녕하세요. 문의 주신 내용에 대해 답변 드립니다.
    repliedByName:
      type: string
      description: 답변 작성자 이름
      example: 관리자
    createdAt:
      type: string
      format: date-time
      description: 답변 작성 일시
      example: '2024-01-16T10:30:00Z'
CreateInquiryReplyRequest:
  type: object
  description: 문의 답변 작성 요청
  properties:
    content:
      type: string
      description: 답변 내용
      example: 안녕하세요. 문의 주신 내용에 대해 답변 드립니다.
      minLength: 1
  required:
  - content
CreateInquiryMemoRequest:
  type: object
  description: 문의 메모 작성 요청 (관리자용)
  properties:
    content:
      type: string
      description: 메모 내용
      example: 추가 확인 필요
      minLength: 1
  required:
  - content
InquiryMemoResponse:
  type: object
  description: 문의 메모 응답 (관리자용)
  properties:
    id:
      type: integer
      format: int64
      description: 메모 ID
      example: 1
    content:
      type: string
      description: 메모 내용
      example: 추가 확인 필요
    writtenByName:
      type: string
      description: 메모 작성자 이름
      example: 관리자
    createdAt:
      type: string
      format: date-time
      description: 메모 작성 일시
      example: '2024-01-15T11:30:00Z'
CreateMemberInquiryRequest:
  type: object
  description: 회원 문의 생성 요청
  properties:
    type:
      type: string
      description: 문의 유형
      enum:
      - JOIN
      - EVENT
      - REPORT
      - ACCOUNT
      - OTHER
      example: EVENT
    title:
      type: string
      description: 문의 제목 (100자 이내)
      example: 활동 관련 문의드립니다
      maxLength: 100
      minLength: 0
    content:
      type: string
      description: 문의 내용
      example: 안녕하세요. 다음 활동 일정에 대해 문의드립니다.
      minLength: 1
    attachments:
      type: array
      description: 첨부파일 목록 (최대 3개)
      items:
        $ref: ./_common.yaml#/AttachmentInfo
      maxItems: 3
      minItems: 0
  required:
  - content
  - title
  - type
InquiryCreateResponse:
  type: object
  description: 문의 생성 응답
  properties:
    id:
      type: integer
      format: int64
      description: 생성된 문의 ID
      example: 1
    inquiryNumber:
      type: string
      description: 생성된 문의 번호
      example: INQ-20240115-001
    message:
      type: string
      description: 결과 메시지
      example: '문의가 접수되었습니다. 문의 번호: INQ-20240115-001'
GuestInquiryLookupRequest:
  type: object
  description: 비회원 문의 조회 요청
  properties:
    inquiryNumber:
      type: string
      description: 조회할 문의 번호
      example: INQ-20240115-001
      minLength: 1
    email:
      type: string
      format: email
      description: 문의 등록 시 사용한 이메일
      example: guest@example.com
      minLength: 1
    password:
      type: string
      format: password
      description: 문의 등록 시 설정한 비밀번호
      example: password123
      minLength: 1
  required:
  - email
  - inquiryNumber
  - password
InquiryResponse:
  type: object
  description: 문의 응답
  properties:
    id:
      type: integer
      format: int64
      description: 문의 고유 ID
      example: 1
    inquiryNumber:
      type: string
      description: 문의 번호
      example: INQ-20240115-001
    type:
      type: string
      description: 문의 유형
      enum:
      - JOIN
      - EVENT
      - REPORT
      - ACCOUNT
      - OTHER
      example: JOIN
    typeDescription:
      type: string
      description: 문의 유형 설명
      example: 가입 문의
    status:
      type: string
      description: 문의 상태
      enum:
      - PENDING
      - IN_PROGRESS
      - COMPLETED
      example: PENDING
    statusDescription:
      type: string
      description: 문의 상태 설명
      example: 대기중
    title:
      type: string
      description: 문의 제목
      example: 동아리 가입 문의드립니다
    content:
      type: string
      description: 문의 내용
      example: 안녕하세요. 동아리 가입 절차에 대해 문의드립니다.
    authorName:
      type: string
      description: 작성자 이름
      example: 홍길동
    authorEmail:
      type: string
      description: 작성자 이메일
      example: user@example.com
    attachments:
      type: array
      description: 첨부파일 목록
      items:
        $ref: ./_common.yaml#/AttachmentResponse
    reply:
      $ref: '#/InquiryReplyResponse'
      description: 답변 (답변이 없는 경우 null)
    createdAt:
      type: string
      format: date-time
      description: 문의 작성 일시
      example: '2024-01-15T10:30:00Z'
    updatedAt:
      type: string
      format: date-time
      description: 문의 수정 일시
      example: '2024-01-15T11:00:00Z'
    guest:
      type: boolean
CreateGuestInquiryRequest:
  type: object
  description: 비회원 문의 생성 요청
  properties:
    type:
      type: string
      description: 문의 유형
      enum:
      - JOIN
      - EVENT
      - REPORT
      - ACCOUNT
      - OTHER
      example: JOIN
    title:
      type: string
      description: 문의 제목 (100자 이내)
      example: 동아리 가입 문의드립니다
      maxLength: 100
      minLength: 0
    content:
      type: string
      description: 문의 내용
      example: 안녕하세요. 동아리 가입 절차에 대해 문의드립니다.
      minLength: 1
    email:
      type: string
      format: email
      description: 비회원 이메일
      example: guest@example.com
      minLength: 1
    name:
      type: string
      description: 비회원 이름 (50자 이내)
      example: 김철수
      maxLength: 50
      minLength: 0
    password:
      type: string
      format: password
      description: 문의 조회용 비밀번호
      example: password123
      minLength: 1
    attachments:
      type: array
      description: 첨부파일 목록 (최대 3개)
      items:
        $ref: ./_common.yaml#/AttachmentInfo
      maxItems: 3
      minItems: 0
  required:
  - content
  - email
  - name
  - password
  - title
  - type
InquiryListPageResponse:
  type: object
  description: 문의 목록 페이징 응답
  properties:
    inquiries:
      type: array
      description: 문의 목록
      items:
        $ref: '#/InquiryListResponse'
    totalElements:
      type: integer
      format: int64
      description: 전체 요소 수
      example: 100
    totalPages:
      type: integer
      format: int32
      description: 전체 페이지 수
      example: 5
    currentPage:
      type: integer
      format: int32
      description: 현재 페이지 번호 (0부터 시작)
      example: 0
    hasNext:
      type: boolean
      description: 다음 페이지 존재 여부
      example: true
InquiryDetailResponse:
  type: object
  description: 문의 상세 응답
  properties:
    id:
      type: integer
      format: int64
      description: 문의 고유 ID
      example: 1
    inquiryNumber:
      type: string
      description: 문의 번호
      example: INQ-20240115-001
    type:
      type: string
      description: 문의 유형
      enum:
      - JOIN
      - EVENT
      - REPORT
      - ACCOUNT
      - OTHER
      example: JOIN
    typeDescription:
      type: string
      description: 문의 유형 설명
      example: 가입 문의
    status:
      type: string
      description: 문의 상태
      enum:
      - PENDING
      - IN_PROGRESS
      - COMPLETED
      example: PENDING
    statusDescription:
      type: string
      description: 문의 상태 설명
      example: 대기중
    title:
      type: string
      description: 문의 제목
      example: 동아리 가입 문의드립니다
    content:
      type: string
      description: 문의 내용
      example: 안녕하세요. 동아리 가입 절차에 대해 문의드립니다.
    authorName:
      type: string
      description: 작성자 이름
      example: 홍길동
    authorEmail:
      type: string
      description: 작성자 이메일
      example: user@example.com
    authorUserId:
      type: integer
      format: int64
      description: 작성자 사용자 ID (회원인 경우)
