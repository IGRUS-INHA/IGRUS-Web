SemesterSummaryResponse:
  type: object
  description: 학기 요약 정보 응답
  properties:
    year:
      type: integer
      format: int32
      description: 연도
      example: 2026
    semester:
      type: integer
      format: int32
      description: 학기 (1 또는 2)
      example: 1
    memberCount:
      type: integer
      format: int64
      description: 회원 수
      example: 30
    displayName:
      type: string
      description: 표시 이름
      example: 2026년 1학기
SemesterMemberListResponse:
  type: object
  description: 학기별 회원 목록 응답
  properties:
    userId:
      type: integer
      format: int64
      description: 사용자 ID
      example: 1
    studentId:
      type: string
      description: 학번 (등록 시점 스냅샷)
      example: 12345678
    name:
      type: string
      description: 이름 (등록 시점 스냅샷)
      example: 홍길동
    department:
      type: string
      description: 학과 (등록 시점 스냅샷)
      example: 컴퓨터공학과
    email:
      type: string
      description: 이메일
      example: user@example.com
    phoneNumber:
      type: string
      description: 전화번호
      example: 010-1234-5678
    role:
      type: string
      description: 등록 시점 역할
      enum:
      - ASSOCIATE
      - MEMBER
      - OPERATOR
      - ADMIN
      example: MEMBER
    isWithdrawn:
      type: boolean
      description: 탈퇴 여부
    grade:
      type: integer
      format: int32
      description: 학년 (등록 시점 스냅샷)
      example: 2
    motivation:
      type: string
      description: 가입 동기 (등록 시점 스냅샷)
      example: 웹 개발 역량을 키우고 싶습니다.
