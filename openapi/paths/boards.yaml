boardsByBoardCodePostsByPostId:
  get:
    tags:
    - Post
    summary: 게시글 상세 조회
    description: 게시글의 상세 정보를 조회합니다. 조회 시 조회수가 1 증가합니다.
    operationId: getPostDetail
    parameters:
    - name: boardCode
      in: path
      description: 게시판 코드
      required: true
      schema:
        type: string
      example: GENERAL
    - name: postId
      in: path
      description: 게시글 ID
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    responses:
      '200':
        description: 게시글 상세 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostDetailResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostDetailResponse
      '403':
        description: 읽기 권한 없음
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostDetailResponse
      '404':
        description: 게시글을 찾을 수 없음
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostDetailResponse
    security:
    - BearerAuthentication: []
  put:
    tags:
    - Post
    summary: 게시글 수정
    description: 게시글을 수정합니다. 작성자 본인 또는 관리자만 수정 가능합니다.
    operationId: updatePost
    parameters:
    - name: boardCode
      in: path
      description: 게시판 코드
      required: true
      schema:
        type: string
      example: GENERAL
    - name: postId
      in: path
      description: 게시글 ID
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/boards.yaml#/UpdatePostRequest
      required: true
    responses:
      '200':
        description: 게시글 수정 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostUpdateResponse
      '400':
        description: 잘못된 요청 (제목 누락, 100자 초과, 이미지 5개 초과 등)
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostUpdateResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostUpdateResponse
      '403':
        description: 수정 권한 없음
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostUpdateResponse
      '404':
        description: 게시글을 찾을 수 없음
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostUpdateResponse
    security:
    - BearerAuthentication: []
  delete:
    tags:
    - Post
    summary: 게시글 삭제
    description: 게시글을 삭제합니다. 작성자 본인 또는 운영자 이상 권한을 가진 사용자만 삭제 가능합니다.
    operationId: deletePost
    parameters:
    - name: boardCode
      in: path
      description: 게시판 코드
      required: true
      schema:
        type: string
      example: GENERAL
    - name: postId
      in: path
      description: 게시글 ID
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    responses:
      '204':
        description: 게시글 삭제 성공
      '401':
        description: 인증 필요
      '403':
        description: 삭제 권한 없음
      '404':
        description: 게시글을 찾을 수 없음
    security:
    - BearerAuthentication: []
boardsByBoardCodePosts:
  get:
    tags:
    - Post
    summary: 게시글 목록 조회
    description: 게시판의 게시글 목록을 페이징하여 조회합니다. 키워드 검색 및 질문글 필터링을 지원합니다.
    operationId: getPostList
    parameters:
    - name: boardCode
      in: path
      description: 게시판 코드
      required: true
      schema:
        type: string
      example: GENERAL
    - name: keyword
      in: query
      description: 검색 키워드
      required: false
      schema:
        type: string
    - name: questionOnly
      in: query
      description: 질문글만 조회 여부
      required: false
      schema:
        type: boolean
    - name: page
      in: query
      description: 페이지 번호 (0부터 시작)
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: '0'
    - name: size
      in: query
      description: 페이지당 항목 수
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
      example: '20'
    - name: sort
      in: query
      description: 정렬 조건. 여러 정렬은 sort를 여러 번 지정합니다. (sort=createdAt,DESC&sort=id,ASC)
      required: false
      schema:
        type: array
        default:
        - createdAt,DESC
        items:
          type: string
      example: createdAt,desc
    responses:
      '200':
        description: 게시글 목록 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostListPageResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostListPageResponse
      '403':
        description: 읽기 권한 없음
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostListPageResponse
      '404':
        description: 게시판을 찾을 수 없음
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostListPageResponse
    security:
    - BearerAuthentication: []
  post:
    tags:
    - Post
    summary: 게시글 작성
    description: 게시판에 새 게시글을 작성합니다
    operationId: createPost
    parameters:
    - name: boardCode
      in: path
      description: 게시판 코드
      required: true
      schema:
        type: string
      example: general
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/boards.yaml#/CreatePostRequest
      required: true
    responses:
      '201':
        description: 게시글 작성 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostCreateResponse
      '400':
        description: 잘못된 요청 (제목 누락, 100자 초과, 이미지 5개 초과 등)
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostCreateResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostCreateResponse
      '403':
        description: 쓰기 권한 없음
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostCreateResponse
      '404':
        description: 게시판을 찾을 수 없음
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostCreateResponse
      '429':
        description: 게시글 작성 제한 초과 (시간당 20회)
        content:
          application/json:
            schema:
              $ref: ../schemas/boards.yaml#/PostCreateResponse
    security:
    - BearerAuthentication: []
boards:
  get:
    tags:
    - Board
    summary: 게시판 목록 조회
    description: 사용자 역할에 따라 접근 가능한 게시판 목록을 조회합니다. 읽기 권한이 있는 게시판만 반환됩니다.
    operationId: getBoardList
    responses:
      '200':
        description: 게시판 목록 조회 성공
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/boards.yaml#/BoardListResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/boards.yaml#/BoardListResponse
    security:
    - BearerAuthentication: []
