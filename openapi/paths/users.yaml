    operationId: getMyBookmarks
    parameters:
    - name: page
      in: query
      description: 페이지 번호 (0부터 시작)
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: '0'
    - name: size
      in: query
      description: 페이지당 항목 수
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
      example: '20'
    - name: sort
      in: query
      description: 정렬 조건. 여러 정렬은 sort를 여러 번 지정합니다. (sort=createdAt,DESC&sort=id,ASC)
      required: false
      schema:
        type: array
        default:
        - createdAt,DESC
        items:
          type: string
      example: createdAt,desc
    responses:
      '200':
