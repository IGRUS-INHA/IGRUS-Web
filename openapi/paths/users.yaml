    security:
    - BearerAuthentication: []
usersPublicProfile:
  get:
    tags:
    - Users
    summary: 공개 프로필 조회
    description: 닉네임/자기소개/링크만 담은 공개 프로필을 조회합니다 (play 등 외부 표시용, 인증 불필요)
    operationId: getPublicProfile
    parameters:
    - name: studentId
      in: path
      description: 학번 (8자리 숫자)
      required: true
      schema:
        type: string
        pattern: ^\d{8}$
    responses:
      '200':
        description: 공개 프로필 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/users.yaml#/PublicProfileResponse
      '404':
        description: 사용자를 찾을 수 없음
    security: []
