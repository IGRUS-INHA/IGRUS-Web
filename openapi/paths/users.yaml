usersMeLikes:
  get:
    tags:
    - PostLike
    summary: 내 게시글 좋아요 목록 조회
    description: 내가 좋아요한 게시글 목록을 조회합니다.
    operationId: getMyLikes
    parameters:
    - name: page
      in: query
      description: 페이지 번호 (0부터 시작)
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: '0'
    - name: size
      in: query
      description: 페이지당 항목 수
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
      example: '20'
    - name: sort
      in: query
      description: 정렬 조건. 여러 정렬은 sort를 여러 번 지정합니다. (sort=createdAt,DESC&sort=id,ASC)
      required: false
      schema:
        type: array
        default:
        - createdAt,DESC
        items:
          type: string
      example: createdAt,desc
    responses:
      '200':
        description: 좋아요 목록 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/mypage.yaml#/LikedPostPageResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/mypage.yaml#/LikedPostPageResponse
    security:
    - BearerAuthentication: []
usersMeBookmarks:
  get:
    tags:
    - Bookmark
    summary: 내 북마크 목록 조회
    description: 내가 북마크한 게시글 목록을 조회합니다.
    operationId: getMyBookmarks
    parameters:
    - name: page
      in: query
      description: 페이지 번호 (0부터 시작)
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: '0'
    - name: size
      in: query
      description: 페이지당 항목 수
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
      example: '20'
    - name: sort
      in: query
      description: 정렬 조건. 여러 정렬은 sort를 여러 번 지정합니다. (sort=createdAt,DESC&sort=id,ASC)
      required: false
      schema:
        type: array
        default:
        - createdAt,DESC
        items:
          type: string
      example: createdAt,desc
    responses:
      '200':
        description: 북마크 목록 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/posts.yaml#/BookmarkedPostPageResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/posts.yaml#/BookmarkedPostPageResponse
    security:
    - BearerAuthentication: []
