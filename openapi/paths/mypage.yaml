mypageAccount:
  delete:
    tags:
    - MyPage
    summary: 회원 탈퇴
    description: 비밀번호 확인 후 회원 탈퇴를 진행합니다. 탈퇴 후 5일 이내 복구 가능합니다.
    operationId: withdraw
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/mypage.yaml#/WithdrawRequest
      required: true
    responses:
      '200':
        description: 회원 탈퇴 성공
      '400':
        description: 잘못된 입력값
      '401':
        description: 비밀번호 불일치 또는 인증 필요
    security:
    - BearerAuthentication: []
