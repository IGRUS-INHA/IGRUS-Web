mypageEmailVerify:
  post:
    tags:
    - MyPage
    summary: 이메일 변경 인증
    description: 인증 코드를 확인하고 이메일을 변경합니다
    operationId: verifyEmailChange
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/EmailVerificationRequest
      required: true
    responses:
      '200':
        description: 이메일 변경 성공
      '400':
        description: 인증 코드 만료
      '401':
        description: 인증 코드 불일치 또는 인증 필요
      '409':
        description: 이메일 중복
      '429':
        description: 인증 시도 횟수 초과
    security:
    - BearerAuthentication: []
mypageEmailChangeRequest:
  post:
    tags:
    - MyPage
    summary: 이메일 변경 요청
    description: 비밀번호 확인 후 새 이메일로 인증 코드를 발송합니다
    operationId: requestEmailChange
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/mypage.yaml#/ChangeEmailRequest
      required: true
    responses:
      '200':
        description: 인증 코드 발송 성공
      '400':
        description: 현재 이메일과 동일
      '401':
        description: 비밀번호 불일치 또는 인증 필요
      '409':
        description: 이메일 중복
    security:
    - BearerAuthentication: []
mypageStudentId:
  patch:
    tags:
    - MyPage
    summary: 학번 변경
    description: 임시 학번을 실제 학번으로 변경합니다. 임시 학번 사용자만 가능합니다.
    operationId: updateStudentId
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/mypage.yaml#/UpdateStudentIdRequest
      required: true
    responses:
      '200':
        description: 학번 변경 성공
      '400':
        description: 임시 학번이 아닌 경우, 학번 형식 오류, 또는 99로 시작하는 학번
      '401':
        description: 비밀번호 불일치 또는 인증 필요
      '409':
        description: 학번 중복
    security:
    - BearerAuthentication: []
mypagePhone:
  patch:
    tags:
    - MyPage
    summary: 전화번호 변경
    description: 비밀번호 확인 후 전화번호를 변경합니다
    operationId: changePhoneNumber
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/mypage.yaml#/ChangePhoneNumberRequest
      required: true
    responses:
      '200':
        description: 전화번호 변경 성공
      '400':
        description: 현재 전화번호와 동일하거나 유효하지 않은 형식
      '401':
        description: 비밀번호 불일치 또는 인증 필요
      '409':
        description: 전화번호 중복
    security:
    - BearerAuthentication: []
mypagePassword:
  patch:
    tags:
    - MyPage
    summary: 비밀번호 변경
    description: 현재 비밀번호 확인 후 새 비밀번호로 변경합니다
    operationId: changeMyPassword
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/mypage.yaml#/ChangePasswordRequest
      required: true
    responses:
      '200':
        description: 비밀번호 변경 성공
      '400':
        description: 새 비밀번호 형식 오류 또는 현재 비밀번호와 동일
      '401':
        description: 현재 비밀번호 불일치 또는 인증 필요
    security:
    - BearerAuthentication: []
mypageRegistrations:
  get:
    tags:
    - MyPage
    summary: 내 행사 신청 목록 조회
    description: 내가 신청한 행사 목록을 조회합니다
    operationId: getMyRegistrations
    responses:
      '200':
        description: 행사 신청 목록 조회 성공
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/events.yaml#/MyRegistrationResponse
      '401':
        description: 인증 필요
    security:
    - BearerAuthentication: []
mypageProfile:
  get:
    tags:
    - MyPage
    summary: 내 프로필 조회
    description: 로그인한 사용자의 프로필 정보를 조회합니다
    operationId: getMyProfile
    responses:
      '200':
        description: 프로필 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/mypage.yaml#/MyProfileResponse
      '401':
        description: 인증 필요
      '404':
        description: 사용자를 찾을 수 없음
    security:
    - BearerAuthentication: []
mypagePosts:
  get:
    tags:
    - MyPage
    summary: 내 게시글 목록 조회
    description: 내가 작성한 게시글 목록을 페이징하여 조회합니다
    operationId: getMyPosts
    parameters:
    - name: page
      in: query
      description: 페이지 번호 (0부터 시작)
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: '0'
    - name: size
      in: query
      description: 페이지당 항목 수
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
      example: '20'
    - name: sort
      in: query
      description: 정렬 조건. 여러 정렬은 sort를 여러 번 지정합니다. (sort=createdAt,DESC&sort=id,ASC)
      required: false
      schema:
        type: array
        default:
        - createdAt,DESC
        items:
          type: string
      example: createdAt,desc
    responses:
      '200':
        description: 게시글 목록 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/mypage.yaml#/MyPostPageResponse
      '401':
        description: 인증 필요
    security:
    - BearerAuthentication: []
