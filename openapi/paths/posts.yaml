postsByPostIdCommentsByCommentId:
  delete:
    tags:
    - Comment
    summary: 댓글 삭제
    description: 댓글을 삭제합니다. 작성자 본인 또는 운영자 이상 권한을 가진 사용자만 삭제 가능합니다. Soft Delete로 처리되며, 삭제된 댓글은 '삭제된 댓글입니다'로 표시됩니다.
    operationId: deleteComment
    parameters:
    - name: postId
      in: path
      description: 게시글 ID
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    - name: commentId
      in: path
      description: 댓글 ID
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    responses:
      '204':
        description: 댓글 삭제 성공
      '401':
        description: 인증 필요
      '403':
        description: 삭제 권한 없음
      '404':
        description: 댓글을 찾을 수 없음
    security:
    - BearerAuthentication: []
