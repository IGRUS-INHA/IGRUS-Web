adminUsersByUserIdStatus:
  put:
    tags:
    - Admin User Management
    summary: 회원 상태 변경 (정지/해제)
    description: '회원을 정지하거나 정지를 해제합니다. SUSPEND: 사유와 종료일 필수. LIFT: 활성 정지가 있어야 합니다.'
    operationId: changeUserStatus
    parameters:
    - name: userId
      in: path
      description: 대상 사용자 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/admin.yaml#/ChangeUserStatusRequest
      required: true
    responses:
      '204':
        description: 상태 변경 성공
      '400':
        description: 자기 자신 상태 변경 / 사유 미입력 / 종료일 미입력 / 이미 정지 / 해제할 정지 없음
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (ADMIN 전용)
      '404':
        description: 사용자를 찾을 수 없음
    security:
    - BearerAuthentication: []
adminUsersByUserIdRole:
  put:
    tags:
    - Admin User Management
    summary: 회원 권한 변경
    description: 회원의 권한을 변경합니다.
    operationId: changeUserRole
    parameters:
    - name: userId
      in: path
      description: 대상 사용자 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/admin.yaml#/ChangeUserRoleRequest
      required: true
    responses:
      '204':
        description: 변경 성공
      '400':
        description: 자기 자신 권한 변경, 동일 역할 변경, 또는 마지막 ADMIN 권한 변경 시도
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (ADMIN 전용)
      '404':
        description: 사용자를 찾을 수 없음
    security:
    - BearerAuthentication: []
adminUsersByUserIdForceActivate:
  post:
    tags:
    - Admin User Management
    summary: 회원 강제 활성화 (이메일 인증 우회)
    description: 이메일 인증 대기(PENDING_VERIFICATION) 상태의 회원을 강제로 활성화합니다.
    operationId: forceActivateUser
    parameters:
    - name: userId
      in: path
      description: 대상 사용자 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '204':
        description: 강제 활성화 성공
      '400':
        description: 이메일 인증 대기 상태가 아님
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (ADMIN 전용)
      '404':
        description: 사용자를 찾을 수 없음
    security:
    - BearerAuthentication: []
adminSemestersByYearBySemesterMembers:
  post:
    tags:
    - Admin Semester Member
    summary: 회원 일괄 등록
    description: 선택된 회원들을 특정 학기에 일괄 등록합니다. 이미 등록된 회원은 건너뜁니다.
    operationId: registerMembers
    parameters:
    - name: year
      in: path
      description: 연도
      required: true
      schema:
        type: integer
        format: int32
      example: 2026
    - name: semester
      in: path
      description: 학기 (1 또는 2)
      required: true
      schema:
        type: integer
        format: int32
      example: 1
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/admin.yaml#/RegisterSemesterMembersRequest
      required: true
    responses:
      '200':
        description: 등록 완료
        content:
          application/json:
            schema:
              $ref: ../schemas/admin.yaml#/RegisterSemesterMembersResponse
      '400':
        description: 잘못된 요청 (빈 목록, 잘못된 연도/학기)
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (ADMIN 권한 필요)
    security:
    - BearerAuthentication: []
  delete:
    tags:
    - Admin Semester Member
    summary: 회원 일괄 제외
    description: 선택된 회원들을 특정 학기에서 일괄 제외합니다.
    operationId: removeMembers
    parameters:
    - name: year
      in: path
      description: 연도
      required: true
      schema:
        type: integer
        format: int32
      example: 2026
    - name: semester
      in: path
      description: 학기 (1 또는 2)
      required: true
      schema:
        type: integer
        format: int32
      example: 1
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/admin.yaml#/RemoveSemesterMembersRequest
      required: true
    responses:
      '200':
        description: 제외 완료
        content:
          application/json:
            schema:
              type: integer
              format: int32
      '400':
        description: 잘못된 요청 (빈 목록, 잘못된 연도/학기)
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (ADMIN 권한 필요)
    security:
    - BearerAuthentication: []
adminAssociatesByIdReject:
  post:
    tags:
    - Admin Associate Approval
    summary: 개별 준회원 거절
    description: 특정 준회원의 가입을 거절합니다. ADMIN 권한이 필요합니다. 거절 사유는 필수입니다.
    operationId: rejectAssociate
    parameters:
    - name: id
      in: path
      description: 거절할 사용자 ID
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/admin.yaml#/RejectAssociateRequest
      required: true
    responses:
      '200':
        description: 거절 성공
      '400':
        description: 해당 사용자가 준회원이 아니거나 이미 처리됨
      '401':
        description: 인증 필요 (로그인하지 않음)
      '403':
        description: 권한 없음 (ADMIN 권한 필요)
      '404':
        description: 사용자를 찾을 수 없음
    security:
    - BearerAuthentication: []
adminAssociatesByIdApprove:
  post:
    tags:
    - Admin Associate Approval
    summary: 개별 준회원 승인
    description: 특정 준회원을 정회원으로 승인합니다. ADMIN 권한이 필요합니다.
    operationId: approveAssociate
    parameters:
    - name: id
      in: path
      description: 승인할 사용자 ID
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    responses:
      '200':
        description: 승인 성공
      '401':
        description: 인증 필요 (로그인하지 않음)
      '403':
        description: 권한 없음 (ADMIN 권한 필요)
      '404':
        description: 사용자를 찾을 수 없음
      '400':
        description: 해당 사용자가 준회원이 아님
    security:
    - BearerAuthentication: []
adminAssociatesRejectBatch:
  post:
    tags:
    - Admin Associate Approval
    summary: 준회원 일괄 거절
    description: 여러 준회원의 가입을 한 번에 거절합니다. ADMIN 권한이 필요합니다. 일부 사용자 거절이 실패해도 나머지는 정상 처리됩니다.
    operationId: rejectBulk
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/admin.yaml#/BulkRejectionRequest
      required: true
    responses:
      '200':
        description: 일괄 거절 처리 완료 (부분 성공 가능)
        content:
          application/json:
            schema:
              $ref: ../schemas/admin.yaml#/BulkRejectionResultResponse
      '400':
        description: 거절할 사용자 목록이 비어있음
      '401':
        description: 인증 필요 (로그인하지 않음)
      '403':
        description: 권한 없음 (ADMIN 권한 필요)
    security:
    - BearerAuthentication: []
adminAssociatesApproveBatch:
  post:
    tags:
    - Admin Associate Approval
    summary: 준회원 일괄 승인
    description: 여러 준회원을 한 번에 정회원으로 승인합니다. ADMIN 권한이 필요합니다. 일부 사용자 승인이 실패해도 나머지는 정상 처리됩니다.
    operationId: approveBulk
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/admin.yaml#/BulkApprovalRequest
      required: true
    responses:
      '200':
        description: 일괄 승인 처리 완료 (부분 성공 가능)
        content:
          application/json:
            schema:
              $ref: ../schemas/admin.yaml#/BulkApprovalResultResponse
      '401':
        description: 인증 필요 (로그인하지 않음)
      '403':
        description: 권한 없음 (ADMIN 권한 필요)
      '400':
        description: 승인할 사용자 목록이 비어있음
    security:
    - BearerAuthentication: []
adminUsersByUserIdInfo:
  patch:
    tags:
    - Admin User Management
    summary: 회원 정보 수정
    description: 관리자가 회원의 프로필 정보를 수정합니다. null 필드는 기존 값을 유지합니다. 학번, 역할, 상태, 비밀번호는 별도 API를 사용하세요.
    operationId: editUserInfo
    parameters:
    - name: userId
      in: path
      description: 대상 사용자 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/admin.yaml#/AdminEditUserInfoRequest
      required: true
    responses:
      '204':
        description: 정보 수정 성공
      '400':
        description: 잘못된 입력값
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (ADMIN 전용)
      '404':
        description: 사용자를 찾을 수 없음
      '409':
        description: 이메일 또는 전화번호 중복
    security:
    - BearerAuthentication: []
adminCommentReportsByReportId:
  patch:
    tags:
    - Comment Report
    summary: 신고 처리 (관리자)
    description: 신고를 처리합니다 (승인/반려). OPERATOR 이상 권한이 필요합니다.
    operationId: updateReportStatus
    parameters:
    - name: reportId
      in: path
      description: 신고 ID
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/admin.yaml#/UpdateReportStatusRequest
      required: true
    responses:
      '204':
        description: 신고 처리 성공
      '400':
        description: 잘못된 요청 (상태 누락)
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (OPERATOR 이상 필요)
      '404':
        description: 신고를 찾을 수 없음
    security:
    - BearerAuthentication: []
adminUsers:
  get:
    tags:
    - Admin User Management
    summary: 회원 목록 조회
    description: 회원 목록을 조회합니다. 검색어, 역할, 상태로 필터링 가능합니다.
    operationId: getUserList
    parameters:
    - name: keyword
      in: query
      description: 검색어 (이름 또는 학번)
      required: false
      schema:
        type: string
    - name: role
      in: query
      description: 역할 필터
      required: false
      schema:
        type: string
        enum:
        - ASSOCIATE
        - MEMBER
        - OPERATOR
        - ADMIN
    - name: status
      in: query
      description: 상태 필터
      required: false
      schema:
        type: string
        enum:
        - PENDING_VERIFICATION
        - ACTIVE
        - SUSPENDED
        - WITHDRAWN
    - name: page
      in: query
      description: 페이지 번호 (0부터 시작)
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: '0'
    - name: size
      in: query
      description: 페이지당 항목 수
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
      example: '20'
    - name: sort
      in: query
      description: 정렬 조건. 여러 정렬은 sort를 여러 번 지정합니다. (sort=createdAt,DESC&sort=id,ASC)
      required: false
      schema:
        type: array
        default:
        - createdAt,DESC
        items:
          type: string
      example: createdAt,desc
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/admin.yaml#/UserListPageResponse
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (OPERATOR 이상 필요)
    security:
    - BearerAuthentication: []
adminUsersByUserId:
  get:
    tags:
    - Admin User Management
    summary: 회원 상세 조회
    description: 특정 회원의 상세 정보를 조회합니다.
    operationId: getUserDetail
    parameters:
    - name: userId
      in: path
      description: 사용자 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/admin.yaml#/UserDetailResponse
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (OPERATOR 이상 필요)
      '404':
        description: 사용자를 찾을 수 없음
    security:
    - BearerAuthentication: []
  delete:
    tags:
    - Admin User Management
    summary: 회원 강제 탈퇴
    description: 관리자가 회원을 강제 탈퇴시킵니다. 사유 입력 필수.
    operationId: forceWithdrawUser
    parameters:
    - name: userId
      in: path
      description: 대상 사용자 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/admin.yaml#/ForceWithdrawRequest
      required: true
    responses:
      '204':
        description: 강제 탈퇴 성공
      '400':
        description: 자기 자신 강제 탈퇴 / 마지막 ADMIN 강제 탈퇴 시도
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (ADMIN 전용)
      '404':
        description: 사용자를 찾을 수 없음
    security:
    - BearerAuthentication: []
adminUsersRoleHistories:
  get:
    tags:
    - Admin User Management
    summary: 권한 변경 이력 조회
    description: 권한 변경 이력을 조회합니다. 사용자, 역할, 변경자, 날짜 범위로 필터링 가능합니다.
    operationId: getRoleHistories
    parameters:
    - name: userId
      in: query
      description: 대상 사용자 ID
      required: false
      schema:
        type: integer
        format: int64
    - name: previousRole
      in: query
      description: 변경 전 역할 필터
      required: false
      schema:
        type: string
        enum:
        - ASSOCIATE
        - MEMBER
        - OPERATOR
        - ADMIN
    - name: newRole
      in: query
      description: 변경 후 역할 필터
      required: false
      schema:
        type: string
        enum:
        - ASSOCIATE
        - MEMBER
        - OPERATOR
        - ADMIN
    - name: changedBy
      in: query
      description: 변경자 ID 필터
      required: false
      schema:
        type: integer
        format: int64
    - name: startDate
      in: query
      description: 시작 일시
      required: false
      schema:
        type: string
        format: date-time
    - name: endDate
      in: query
      description: 종료 일시
      required: false
      schema:
        type: string
        format: date-time
    - name: page
      in: query
      description: 페이지 번호 (0부터 시작)
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: '0'
    - name: size
      in: query
      description: 페이지당 항목 수
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
      example: '20'
    - name: sort
      in: query
      description: 정렬 조건. 여러 정렬은 sort를 여러 번 지정합니다. (sort=createdAt,DESC&sort=id,ASC)
      required: false
      schema:
        type: array
        default:
        - createdAt,DESC
        items:
          type: string
      example: createdAt,desc
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/admin.yaml#/PageUserRoleHistoryResponse
      '400':
        description: 잘못된 요청 (날짜 범위 역전 등)
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (ADMIN 전용)
    security:
    - BearerAuthentication: []
adminSemestersByYearBySemesterCandidates:
  get:
    tags:
    - Admin Semester Member
    summary: 등록 후보 회원 목록 조회
    description: 특정 학기에 등록 가능한 회원 목록을 조회합니다. ASSOCIATE 이상 + ACTIVE 상태 회원이 대상입니다.
    operationId: getCandidateMembers
    parameters:
    - name: year
      in: path
      description: 연도
      required: true
      schema:
        type: integer
        format: int32
      example: 2026
    - name: semester
      in: path
      description: 학기 (1 또는 2)
      required: true
      schema:
        type: integer
        format: int32
      example: 1
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/admin.yaml#/CandidateMemberResponse
      '400':
        description: 잘못된 연도 또는 학기
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (ADMIN 권한 필요)
    security:
    - BearerAuthentication: []
adminLoginHistories:
  get:
    tags:
    - Admin Login History
    summary: 로그인 이력 조회
    description: 로그인 이력을 복합 필터로 조회합니다. 모든 필터는 선택적입니다. ADMIN 권한이 필요합니다.
    operationId: getLoginHistories
    parameters:
    - name: studentId
      in: query
      description: 학번 필터
      required: false
      schema:
        type: string
      example: 12345678
    - name: success
      in: query
      description: 성공 여부 필터
      required: false
      schema:
        type: boolean
      example: true
    - name: ipAddress
      in: query
      description: IP 주소 필터
      required: false
      schema:
        type: string
      example: 192.168.1.100
    - name: startDate
      in: query
      description: 조회 시작일 (ISO 8601)
      required: false
      schema:
        type: string
        format: date-time
      example: '2024-01-01T00:00:00Z'
    - name: endDate
      in: query
      description: 조회 종료일 (ISO 8601)
      required: false
      schema:
        type: string
        format: date-time
      example: '2024-12-31T23:59:59Z'
    - name: page
      in: query
      description: 페이지 번호 (0부터 시작)
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: '0'
    - name: size
      in: query
      description: 페이지당 항목 수
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
      example: '20'
    - name: sort
      in: query
      description: 정렬 조건. 여러 정렬은 sort를 여러 번 지정합니다. (sort=createdAt,DESC&sort=id,ASC)
      required: false
      schema:
        type: array
        default:
        - attemptedAt,DESC
        items:
          type: string
      example: createdAt,desc
    responses:
      '200':
