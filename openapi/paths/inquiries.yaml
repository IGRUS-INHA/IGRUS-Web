inquiriesByIdStatus:
  put:
    tags:
    - Admin Inquiry
    summary: 문의 상태 변경
    description: 관리자가 문의의 처리 상태를 변경합니다. OPERATOR 또는 ADMIN 권한이 필요합니다.
    operationId: updateInquiryStatus
    parameters:
    - name: id
      in: path
      description: 문의 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/inquiries.yaml#/UpdateInquiryStatusRequest
      required: true
    responses:
      '200':
        description: 상태 변경 성공
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 문의를 찾을 수 없음
    security:
    - BearerAuthentication: []
inquiriesByIdReply:
  put:
    tags:
    - Admin Inquiry
    summary: 답변 수정
    description: 관리자가 기존 답변을 수정합니다. 답변이 없는 경우 에러가 발생합니다. OPERATOR 또는 ADMIN 권한이 필요합니다.
    operationId: updateReply
    parameters:
    - name: id
      in: path
      description: 문의 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/inquiries.yaml#/UpdateInquiryReplyRequest
      required: true
    responses:
      '200':
        description: 답변 수정 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/inquiries.yaml#/InquiryReplyResponse
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 문의 또는 답변을 찾을 수 없음
    security:
    - BearerAuthentication: []
  post:
    tags:
    - Admin Inquiry
    summary: 답변 작성
    description: 관리자가 문의에 답변을 작성합니다. 이미 답변이 있는 경우 에러가 발생합니다. OPERATOR 또는 ADMIN 권한이 필요합니다.
    operationId: createReply
    parameters:
    - name: id
      in: path
      description: 문의 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/inquiries.yaml#/CreateInquiryReplyRequest
      required: true
    responses:
      '201':
        description: 답변 작성 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/inquiries.yaml#/InquiryReplyResponse
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 문의를 찾을 수 없음
      '409':
        description: 이미 답변이 존재함
    security:
    - BearerAuthentication: []
inquiriesByIdMemo:
  post:
    tags:
    - Admin Inquiry
    summary: 내부 메모 작성
    description: 관리자가 문의에 대한 내부 메모를 작성합니다. 메모는 관리자에게만 보입니다. OPERATOR 또는 ADMIN 권한이 필요합니다.
    operationId: createMemo
    parameters:
    - name: id
      in: path
      description: 문의 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/inquiries.yaml#/CreateInquiryMemoRequest
      required: true
    responses:
      '201':
        description: 메모 작성 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/inquiries.yaml#/InquiryMemoResponse
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 문의를 찾을 수 없음
    security:
    - BearerAuthentication: []
inquiriesMember:
  post:
    tags:
    - Member Inquiry
    summary: 회원 문의 작성
    description: 로그인한 회원이 문의를 작성합니다. JWT 인증이 필요합니다.
    operationId: createMemberInquiry
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/inquiries.yaml#/CreateMemberInquiryRequest
      required: true
    responses:
      '201':
        description: 문의 생성 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/inquiries.yaml#/InquiryCreateResponse
      '400':
        description: 잘못된 요청 (유효성 검증 실패)
      '401':
        description: 인증 필요
    security:
    - BearerAuthentication: []
inquiriesLookup:
  post:
    tags:
    - Guest Inquiry
    summary: 비회원 문의 조회
    description: 문의번호, 이메일, 비밀번호로 비회원 문의를 조회합니다.
    operationId: lookupGuestInquiry
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/inquiries.yaml#/GuestInquiryLookupRequest
      required: true
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/inquiries.yaml#/InquiryResponse
      '401':
        description: 비밀번호 불일치
      '404':
        description: 문의를 찾을 수 없음
inquiriesGuest:
  post:
    tags:
    - Guest Inquiry
    summary: 비회원 문의 작성
    description: 비회원이 문의를 작성합니다. 이메일, 이름, 비밀번호가 필수입니다.
    operationId: createGuestInquiry
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/inquiries.yaml#/CreateGuestInquiryRequest
      required: true
    responses:
      '201':
        description: 문의 생성 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/inquiries.yaml#/InquiryCreateResponse
      '400':
        description: 잘못된 요청 (유효성 검증 실패)
inquiries:
  get:
    tags:
    - Admin Inquiry
    summary: 전체 문의 목록 조회
    description: 관리자가 모든 문의를 조회합니다. 유형과 상태로 필터링할 수 있습니다. OPERATOR 또는 ADMIN 권한이 필요합니다.
    operationId: getAllInquiries
    parameters:
    - name: type
      in: query
      description: 문의 유형 필터
      required: false
      schema:
        type: string
        enum:
        - JOIN
        - EVENT
        - REPORT
        - ACCOUNT
        - OTHER
      example: JOIN
    - name: status
      in: query
      description: 처리 상태 필터
      required: false
      schema:
        type: string
        enum:
        - PENDING
        - IN_PROGRESS
        - COMPLETED
      example: PENDING
    - name: page
      in: query
      description: 페이지 번호 (0부터 시작)
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: '0'
    - name: size
      in: query
      description: 페이지당 항목 수
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
      example: '20'
    - name: sort
      in: query
      description: 정렬 조건. 여러 정렬은 sort를 여러 번 지정합니다. (sort=createdAt,DESC&sort=id,ASC)
      required: false
      schema:
        type: array
        default:
        - createdAt,DESC
        items:
          type: string
      example: createdAt,desc
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/inquiries.yaml#/InquiryListPageResponse
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
    security:
    - BearerAuthentication: []
inquiriesById:
  get:
    tags:
    - Admin Inquiry
    summary: 문의 상세 조회 (관리자)
    description: 관리자가 특정 문의의 상세 정보(메모 포함)를 조회합니다. OPERATOR 또는 ADMIN 권한이 필요합니다.
    operationId: getInquiryDetail
    parameters:
    - name: id
      in: path
      description: 문의 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/inquiries.yaml#/InquiryDetailResponse
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 문의를 찾을 수 없음
    security:
    - BearerAuthentication: []
  delete:
    tags:
    - Admin Inquiry
    summary: 문의 삭제
    description: 관리자가 문의를 소프트 삭제합니다. OPERATOR 또는 ADMIN 권한이 필요합니다.
    operationId: deleteInquiry
    parameters:
    - name: id
      in: path
      description: 문의 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '204':
        description: 삭제 성공
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 문의를 찾을 수 없음
    security:
    - BearerAuthentication: []
