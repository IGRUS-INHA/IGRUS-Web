privacyConsentNeedsReconsent:
  get:
    tags:
    - Privacy Consent
    summary: 재동의 필요 여부 확인
    description: 사용자가 현재 정책 버전에 재동의가 필요한지 확인합니다
    operationId: checkNeedsReConsent
    parameters:
    - name: currentVersion
      in: query
      description: 현재 정책 버전
      required: true
      schema:
        type: string
      example: v2.0
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/privacy.yaml#/ConsentCheckResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/privacy.yaml#/ConsentCheckResponse
    security:
    - BearerAuthentication: []
privacyConsentLatest:
  get:
    tags:
    - Privacy Consent
    summary: 최신 동의 기록 조회
    description: 사용자의 최신 개인정보 동의 기록을 조회합니다
    operationId: getLatestConsent
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/privacy.yaml#/PrivacyConsentResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/privacy.yaml#/PrivacyConsentResponse
      '404':
        description: 동의 기록 없음
        content:
          application/json:
            schema:
              $ref: ../schemas/privacy.yaml#/PrivacyConsentResponse
    security:
    - BearerAuthentication: []
privacyConsentHistory:
  get:
    tags:
    - Privacy Consent
    summary: 동의 이력 조회
    description: 사용자의 개인정보 동의 이력을 조회합니다
    operationId: getConsentHistory
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/privacy.yaml#/PrivacyConsentHistoryResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/privacy.yaml#/PrivacyConsentHistoryResponse
    security:
    - BearerAuthentication: []
privacyConsentCheck:
  get:
    tags:
    - Privacy Consent
    summary: 동의 기록 존재 확인
    description: 사용자가 동의한 기록이 있는지 확인합니다
    operationId: checkHasConsent
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/privacy.yaml#/ConsentCheckResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/privacy.yaml#/ConsentCheckResponse
    security:
    - BearerAuthentication: []
privacyConsentCheckVersion:
  get:
    tags:
    - Privacy Consent
    summary: 특정 버전 동의 확인
    description: 사용자가 특정 버전의 정책에 동의했는지 확인합니다
    operationId: checkConsentedToVersion
    parameters:
    - name: version
      in: query
      description: 확인할 정책 버전
      required: true
      schema:
        type: string
      example: v1.0
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/privacy.yaml#/ConsentCheckResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/privacy.yaml#/ConsentCheckResponse
    security:
    - BearerAuthentication: []
