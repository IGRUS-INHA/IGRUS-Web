eventsByEventId:
  get:
    tags:
    - Event
    summary: 행사 상세 조회
    description: 행사의 상세 정보를 조회합니다. 준회원은 조회할 수 없습니다.
    operationId: getEvent
    parameters:
    - name: eventId
      in: path
      description: 행사 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: 행사 상세 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/EventDetailResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/EventDetailResponse
      '403':
        description: 준회원 접근 불가
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/EventDetailResponse
      '404':
        description: 행사를 찾을 수 없음
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/EventDetailResponse
    security:
    - BearerAuthentication: []
  put:
    tags:
    - Event
    summary: 행사 수정
    description: 행사 정보를 수정합니다. 운영진 이상만 가능합니다.
    operationId: updateEvent
    parameters:
    - name: eventId
      in: path
      description: 행사 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/events.yaml#/UpdateEventRequest
      required: true
    responses:
      '200':
        description: 행사 수정 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/EventDetailResponse
      '400':
        description: 잘못된 요청 또는 수정 불가능한 상태
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/EventDetailResponse
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/EventDetailResponse
      '403':
        description: 권한 없음
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/EventDetailResponse
      '404':
        description: 행사를 찾을 수 없음
        content:
          application/json:
            schema:
              $ref: ../schemas/events.yaml#/EventDetailResponse
    security:
    - BearerAuthentication: []
  delete:
    tags:
    - Event
    summary: 행사 삭제
    description: 행사를 삭제합니다. 운영진 이상만 가능합니다.
    operationId: deleteEvent
    parameters:
    - name: eventId
      in: path
      description: 행사 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '204':
        description: 행사 삭제 성공
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 행사를 찾을 수 없음
    security:
    - BearerAuthentication: []
registrationsByRegistrationIdRevert:
