        description: 권한 없음
      '404':
        description: 설문 또는 질문을 찾을 수 없음
    security:
    - BearerAuthentication: []
surveysBySurveyIdPublish:
  post:
    tags:
    - Survey
    summary: 설문 공개
    description: 설문을 공개합니다. UNPUBLISHED → PUBLISHED. 질문 구조 유효성 검증을 수행합니다. 운영진 이상 권한 필요.
    operationId: publishSurvey
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: 설문 공개 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyDetailResponse
      '400':
        description: 공개 조건 미충족 또는 이미 공개 상태
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 설문을 찾을 수 없음
    security:
    - BearerAuthentication: []
surveysBySurveyIdPublishAndOpen:
  post:
    tags:
    - Survey
    summary: 설문 공개 + 응답 수집 시작
    description: 설문을 공개하고 동시에 응답 수집을 시작합니다. UNPUBLISHED 상태에서만 가능합니다. 질문 구조 유효성 검증을 수행합니다. 운영진 이상 권한 필요.
    operationId: publishAndOpen
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: 공개 + 응답 수집 시작 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyDetailResponse
      '400':
        description: 공개 조건 미충족 또는 마감일 경과
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 설문을 찾을 수 없음
    security:
    - BearerAuthentication: []
surveysBySurveyIdOpen:
  post:
    tags:
    - Survey
    summary: 응답 수집 시작
    description: 응답 수집을 시작(또는 재개)합니다. NOT_STARTED/CLOSED → OPEN. PUBLISHED 상태에서만 가능하며 마감일이 경과하지 않아야 합니다. 운영진 이상 권한 필요.
    operationId: openResponse
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: 응답 수집 시작 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyDetailResponse
      '400':
        description: 시작 불가능한 상태 또는 마감일 경과
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 설문을 찾을 수 없음
    security:
    - BearerAuthentication: []
surveysBySurveyIdClose:
  post:
    tags:
    - Survey
    summary: 응답 수집 마감
    description: 응답 수집을 마감합니다. OPEN → CLOSED. 운영진 이상 권한 필요.
    operationId: closeResponse
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: 응답 수집 마감 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyDetailResponse
      '400':
        description: 마감 불가능한 상태
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 설문을 찾을 수 없음
