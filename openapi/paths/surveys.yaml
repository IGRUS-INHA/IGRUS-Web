surveysBySurveyId:
  get:
    tags:
    - Survey
    summary: 설문 상세 조회
    description: 설문의 상세 정보를 조회합니다. 질문·선택지·행을 포함합니다. 운영진 이상 권한 필요.
    operationId: getSurveyDetail
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: 설문 상세 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyDetailResponse
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 설문을 찾을 수 없음
    security:
    - BearerAuthentication: []
  put:
    tags:
    - Survey
    summary: 설문 수정
    description: 설문 정보를 수정합니다. 모든 상태에서 수정 가능합니다. 운영진 이상 권한 필요.
    operationId: updateSurvey
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/surveys.yaml#/UpdateSurveyRequest
      required: true
    responses:
      '200':
        description: 설문 수정 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyDetailResponse
      '400':
        description: 잘못된 요청
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 설문을 찾을 수 없음
    security:
    - BearerAuthentication: []
  delete:
    tags:
    - Survey
    summary: 설문 영구 삭제
    description: 설문을 영구 삭제합니다. 휴지통에 있는 설문만 가능합니다. 운영진 이상 권한 필요.
    operationId: permanentDeleteSurvey
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '204':
        description: 영구 삭제 성공
      '400':
        description: 휴지통에 있는 설문이 아님
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 설문을 찾을 수 없음
    security:
    - BearerAuthentication: []
surveysBySurveyIdResponsesMe:
  get:
    tags:
    - Survey Response
    summary: 본인 응답 조회
    description: 본인이 제출한 응답을 조회합니다.
    operationId: getMyResponse
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: 응답 조회 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyResponseDetailResponse
      '401':
        description: 인증 필요
      '404':
        description: 설문 또는 응답을 찾을 수 없음
    security:
    - BearerAuthentication: []
  put:
    tags:
    - Survey Response
    summary: 본인 응답 수정
    description: 본인이 제출한 응답을 수정합니다. 설문이 OPEN 상태에서만 가능합니다.
    operationId: updateMyResponse
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/surveys.yaml#/SubmitSurveyResponseRequest
      required: true
    responses:
      '200':
        description: 응답 수정 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyResponseDetailResponse
      '400':
        description: 응답 유효성 검증 실패 또는 응답 불가 상태
      '401':
        description: 인증 필요
      '404':
        description: 설문 또는 응답을 찾을 수 없음
    security:
    - BearerAuthentication: []
surveys:
  get:
    tags:
    - Survey
    summary: 설문 목록 조회
    description: 활성 설문 목록을 조회합니다. 휴지통 설문은 제외됩니다. 운영진 이상 권한 필요.
    operationId: getSurveyList
    responses:
      '200':
        description: 설문 목록 조회 성공
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/surveys.yaml#/SurveyListResponse
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
    security:
    - BearerAuthentication: []
  post:
    tags:
    - Survey
    summary: 설문 생성
    description: '새로운 설문을 생성합니다. 초기 상태: UNPUBLISHED + NOT_STARTED. 운영진 이상 권한 필요.'
    operationId: createSurvey
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/surveys.yaml#/CreateSurveyRequest
      required: true
    responses:
      '201':
        description: 설문 생성 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyDetailResponse
      '400':
        description: 잘못된 요청
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
    security:
    - BearerAuthentication: []
surveysBySurveyIdUnpublish:
  post:
    tags:
    - Survey
    summary: 설문 비공개
    description: 설문을 비공개로 전환합니다. PUBLISHED → UNPUBLISHED. 응답 수집 중(OPEN)이면 자동 마감됩니다. 운영진 이상 권한 필요.
    operationId: unpublishSurvey
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: 설문 비공개 전환 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyDetailResponse
      '400':
        description: 이미 비공개 상태
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 설문을 찾을 수 없음
    security:
    - BearerAuthentication: []
surveysBySurveyIdTrash:
  post:
    tags:
    - Survey
    summary: 설문 휴지통 이동
    description: 설문을 휴지통으로 이동합니다. 모든 상태에서 가능합니다. 운영진 이상 권한 필요.
    operationId: trashSurvey
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '204':
        description: 휴지통 이동 성공
      '400':
        description: 이미 휴지통에 있는 설문
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 설문을 찾을 수 없음
    security:
    - BearerAuthentication: []
surveysBySurveyIdRestore:
  post:
    tags:
    - Survey
    summary: 설문 휴지통 복원
    description: 휴지통에서 설문을 복원합니다. 운영진 이상 권한 필요.
    operationId: restoreSurvey
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '204':
        description: 복원 성공
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 설문을 찾을 수 없음
    security:
    - BearerAuthentication: []
surveysBySurveyIdResponses:
  post:
    tags:
    - Survey Response
    summary: 설문 응답 제출
    description: 회원이 설문에 응답을 제출합니다. 설문당 1회만 가능합니다.
    operationId: submitResponse
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/surveys.yaml#/SubmitSurveyResponseRequest
      required: true
    responses:
      '201':
        description: 응답 제출 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyResponseDetailResponse
      '400':
        description: 응답 유효성 검증 실패 또는 응답 불가 상태
      '401':
        description: 인증 필요
      '403':
        description: 응답 권한 없음
      '404':
        description: 설문을 찾을 수 없음
      '409':
        description: 이미 응답한 설문
    security:
    - BearerAuthentication: []
surveysBySurveyIdResponsesAnonymous:
  post:
    tags:
    - Survey Anonymous Response
    summary: 비회원 설문 응답 제출
    description: 비회원이 PUBLIC 설문에 응답을 제출합니다. 인증 없이 접근 가능합니다.
    operationId: submitAnonymousResponse
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../schemas/surveys.yaml#/SubmitSurveyResponseRequest
      required: true
    responses:
      '201':
        description: 응답 제출 성공
        content:
          application/json:
            schema:
              $ref: ../schemas/surveys.yaml#/SurveyResponseDetailResponse
      '400':
        description: 응답 유효성 검증 실패 또는 응답 불가 상태
      '403':
        description: 비회원 응답이 허용되지 않는 설문
      '404':
        description: 설문을 찾을 수 없음
