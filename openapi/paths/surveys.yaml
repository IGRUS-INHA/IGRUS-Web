                $ref: ../schemas/surveys.yaml#/OptionResponse
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음
      '404':
        description: 설문 또는 질문을 찾을 수 없음
    security:
    - BearerAuthentication: []
  post:
    tags:
    - Survey Question Option
    summary: 선택지 추가
    description: 질문에 새로운 선택지를 추가합니다. 운영진 이상 권한 필요.
