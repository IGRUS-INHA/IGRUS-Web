  post:
    tags:
    - Survey Question Row
    summary: 행 추가
    description: 질문에 새로운 그리드 행을 추가합니다. 운영진 이상 권한 필요.
    operationId: createRow
    parameters:
    - name: surveyId
      in: path
      description: 설문 ID
      required: true
