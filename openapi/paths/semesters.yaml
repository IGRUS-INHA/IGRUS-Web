semesters:
  get:
    tags:
    - Semester Member
    summary: 학기 목록 조회
    description: 멤버십 기록이 존재하는 학기 목록을 회원 수와 함께 최신순으로 조회합니다.
    operationId: getSemesterList
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/semesters.yaml#/SemesterSummaryResponse
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (OPERATOR 이상 필요)
    security:
    - BearerAuthentication: []
semestersByYearBySemesterMembers:
  get:
    tags:
    - Semester Member
    summary: 학기별 회원 명단 조회
    description: 특정 학기의 회원 명단을 조회합니다. 탈퇴 회원도 포함됩니다.
    operationId: getMemberList
    parameters:
    - name: year
      in: path
      description: 연도
      required: true
      schema:
        type: integer
        format: int32
      example: 2026
    - name: semester
      in: path
      description: 학기 (1 또는 2)
      required: true
      schema:
        type: integer
        format: int32
      example: 1
    - name: keyword
      in: query
      description: 검색 키워드 (학번, 이름)
      required: false
      schema:
        type: string
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/semesters.yaml#/SemesterMemberListResponse
      '400':
        description: 잘못된 연도 또는 학기
      '401':
        description: 인증 필요
      '403':
        description: 권한 없음 (OPERATOR 이상 필요)
    security:
    - BearerAuthentication: []
